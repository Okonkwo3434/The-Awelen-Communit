<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awelen Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--purple:#5b21b6;--purple-ink:#2e1065;--purple-2:#7c3aed;--purple-soft:#f1eafd;--lemon:#f5ec42;--lemon-2:#e6dc1f;--lemon-soft:#fdfbdc;--black:#121016;--ink:#121016;--ink-2:#45404f;--ink-3:#6b6577;--page:#f7f6fa;--line:#e6e2ee;--line-strong:#cdc6d8;--red:#b42318;--serif:"Young Serif",Georgia,serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--r:12px}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--purple);text-underline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.2;margin:0 0 .4em}
h1{font-size:clamp(1.5rem,1.1rem + 1.4vw,2.1rem)}h2{font-size:1.25rem}
h3{font-family:var(--sans);font-weight:600;font-size:1rem}
p{margin:0 0 .8em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--purple-2);outline-offset:2px}
.top :focus-visible,.banner :focus-visible,.hero :focus-visible{outline-color:var(--lemon)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid transparent;font-weight:600;text-decoration:none;background:var(--purple);color:#fff}
.btn:hover{background:var(--purple-ink);color:#fff}
.btn.lemon{background:var(--lemon);color:var(--black)}.btn.lemon:hover{background:var(--lemon-2);color:var(--black)}
.btn.quiet{background:#fff;color:var(--ink);border-color:var(--line-strong)}.btn.quiet:hover{border-color:var(--purple);color:var(--purple)}
.btn.onDark{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}.btn.onDark:hover{background:rgba(255,255,255,.14)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.85rem;border-radius:8px}
.btn.danger{background:#fff;color:var(--red);border-color:#e7a59f}
.btn.ghost{background:none;color:var(--ink-2);border:0;padding:6px 8px}.btn.ghost:hover{background:var(--purple-soft);color:var(--purple)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--ink-3)}.small{font-size:.85rem}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* demo bar */
.demo{background:var(--lemon-soft);border-bottom:1px solid #ece49a;font-size:.85rem}
.demo .in{max-width:1280px;margin:0 auto;padding:6px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:4px 10px;font-weight:600;font-size:.8rem;color:var(--ink)}
.chip.on{background:var(--black);border-color:var(--black);color:#fff}
/* top bar */
.top{background:var(--black);color:#fff}
.top .in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;gap:10px;align-items:center;color:#fff;text-decoration:none;font-family:var(--serif);font-size:1.15rem}
.brand:hover{color:#fff}
.top .tl{margin-left:auto;font-size:.8rem;color:#c9c3d4}
.iconbtn{position:relative;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:7px 10px;min-height:38px}
.menu-btn{display:none}
/* main banner */
.banner{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 160% at 0% 0%,#7c3aed 0%,var(--purple) 40%,var(--purple-ink) 100%);border-bottom:6px solid var(--lemon)}
.banner .deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.banner .bphoto{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.banner .bimg{position:absolute;inset:0 0 0 40%;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.banner .in{position:relative;max-width:1280px;margin:0 auto;padding:44px 16px 40px;min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px}
.kick{display:inline-block;background:var(--lemon);color:var(--black);font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:999px}
.bh{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,1.1rem + 2vw,2.7rem);line-height:1.15;color:#fff;margin:0;max-width:24ch}
.bs{color:#e4dcf5;margin:0;max-width:56ch}
@media (max-width:700px){.banner .deco,.banner .bphoto{opacity:.45}.banner .in{min-height:0;padding:32px 16px}}
/* under-banner bar */
.ubar{background:#fff;border-bottom:1px solid var(--line)}
.ubar .in{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.crumb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ub-acts{margin-left:auto;display:flex;align-items:center;gap:6px}
.ub{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:.88rem;text-decoration:none}
.ub:hover{border-color:var(--purple);color:var(--purple)}
.ub .avatar{margin-left:-7px}
.ub.bell{background:var(--black);color:#fff;border-color:var(--black)}
.ub.bell:hover{background:var(--purple);border-color:var(--purple);color:#fff}
.dot{position:absolute;top:-5px;right:-5px;background:var(--lemon);color:var(--black);border-radius:999px;font-size:.7rem;font-weight:700;padding:0 6px;line-height:1.55;border:2px solid #fff}
.bellwrap{position:relative}
.bellpanel{position:absolute;right:0;top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px rgba(18,16,22,.18);padding:14px;z-index:30}
@media (max-width:640px){.ub .lbl,.crumb,.top .tl{display:none}.ub{padding:6px 11px}}
/* layout */
.layout{max-width:1280px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:20px;align-items:start}
.left,.right{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.nav{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px}
.nav h4{font:700 .7rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:14px 8px 4px}
.nav h4:first-child{margin-top:4px}
.nav a{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--page)}
.nav a.on{background:var(--purple-soft);color:var(--purple);font-weight:600;box-shadow:inset 3px 0 0 var(--purple)}
.nav .ico{width:22px;text-align:center}
.nav .ty{margin-left:auto;font-size:.65rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.right>.card+.card{margin-top:14px}
.right h3{margin-bottom:8px}
.note{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.note:last-of-type{border:0}
.note.unread{font-weight:600}
.note.unread:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--purple);margin-right:6px}
.mini{display:flex;gap:10px;align-items:center;padding:6px 0;text-decoration:none;color:inherit;font-size:.88rem}
.mini:hover b{text-decoration:underline}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:var(--page);border-radius:8px;padding:8px 10px}
.stat b{display:block;font:400 1.3rem var(--serif)}
.stat span{font-size:.78rem;color:var(--ink-3)}
.tools{display:grid;gap:6px}
.tools .btn{justify-content:flex-start}
@media (max-width:1100px){.layout{grid-template-columns:240px minmax(0,1fr)}.right{grid-column:2;position:static;max-height:none}}
@media (max-width:820px){
 .layout{grid-template-columns:minmax(0,1fr)}.right{grid-column:1}
 .left{position:fixed;top:0;bottom:0;left:0;width:min(300px,85vw);max-height:none;z-index:50;background:var(--page);padding:12px;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
 .left.open{transform:none}.menu-btn{display:inline-flex}
 .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
}
/* space banners */
.sban{padding:0;overflow:hidden}
.sb-art{position:relative;height:150px;background:var(--lemon);background-size:cover;background-position:center}
.sb-art .deco,.st-art .deco{position:absolute;inset:0;width:100%;height:100%}
.sb-ico{position:absolute;left:20px;bottom:-28px;width:62px;height:62px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:1.9rem;box-shadow:0 6px 18px rgba(18,16,22,.2);border:3px solid var(--lemon)}
.sb-body{padding:42px 20px 20px}
.sb-name{font-weight:700;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--purple)}
.sban h1{margin:.35em 0 .3em}
.sb-desc{max-width:70ch;margin:0}
.hier{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;color:var(--ink-3)}
.hier span{background:var(--purple-soft);color:var(--purple);font-weight:600;padding:2px 10px;border-radius:999px}
.hier span:first-child{background:var(--lemon);color:var(--black)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:700;background:var(--purple-soft);color:var(--purple);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.badge.lemon{background:var(--lemon);color:var(--black)}
.badge.grey{background:#ecebef;color:var(--ink-2)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{display:block;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--purple);color:inherit}
.stile{padding:0;overflow:hidden}
.st-art{position:relative;height:78px;background:linear-gradient(120deg,var(--purple-ink),var(--purple));background-size:cover;background-position:center}
.st-art span{position:absolute;left:12px;bottom:-17px;width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:1.25rem;box-shadow:0 3px 10px rgba(0,0,0,.15);border:2px solid var(--lemon)}
.st-b{padding:24px 14px 14px}
.st-b h3{margin:0 0 4px}
.hero{border-radius:var(--r);padding:24px 130px 24px 24px;color:#fff;background:var(--black);border-left:6px solid var(--purple-2);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:0;top:0;bottom:0;width:96px;background:repeating-linear-gradient(135deg,var(--lemon) 0 10px,transparent 10px 24px);pointer-events:none}
@media (max-width:560px){.hero{padding-right:24px}.hero:after{width:36px}}
.hero h1{color:#fff;margin:8px 0 6px}
.hero p{color:#e4dcf5;max-width:62ch}
.crumbs{color:var(--ink-3)}
/* tracks */
.track{background:#fff;border:1px solid var(--line);border-left:6px solid var(--lemon);border-radius:var(--r);padding:18px}
.th{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.tnum{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.th h2{margin:.15em 0 .2em}.th p{margin:0;max-width:64ch}
/* posts */
.post header{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post footer{display:flex;gap:4px;margin-top:6px}
.comments{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.cmt{display:flex;gap:8px;margin-bottom:8px;font-size:.9rem}
.cmt .b{background:var(--page);border-radius:10px;padding:6px 10px}
textarea,input,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(91,33,182,.18)}
label.f{display:block}label.f>span,.lbl{display:block;font-weight:600;font-size:.85rem;margin-bottom:4px}label.f small{display:block;color:var(--ink-3);margin-top:3px}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.guide{background:var(--lemon-soft);border-color:#ece49a}
.guide ol{margin:6px 0 10px;padding-left:20px}
fieldset.fs{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0}
fieldset.fs legend{font-weight:700;padding:0 6px}
fieldset.fs>label,fieldset.fs>div,fieldset.fs>img{margin-top:10px}
/* courses */
.ccard .strip{height:8px;border-radius:6px;background:linear-gradient(90deg,var(--purple),var(--purple-2) 55%,var(--lemon));margin:-4px 0 12px}
.ccard h3{font-family:var(--serif);font-weight:400;font-size:1.2rem}
.price{font-weight:700;color:var(--purple)}
.progress{height:8px;background:#ece8f2;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--purple);border-radius:999px}
details.mod{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
details.mod+details.mod{margin-top:8px}
details.mod summary{padding:10px 14px;cursor:pointer;font-weight:600}
/* v15: collapsible outline */
.ctools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.ctools .small{margin-right:auto}
.mpart{margin:18px 0 8px;padding:10px 14px;border-left:4px solid var(--lemon-2);background:var(--lemon-soft);border-radius:8px}
.mpart:first-child{margin-top:0}
.mpart b{display:block;font-family:var(--serif);font-weight:400;font-size:1.05rem}
.mpart p{margin:4px 0 0;font-size:.85rem;color:var(--ink-2)}
.mpart+details.mod{margin-top:0}
details.mod summary .mmeta{display:block;font-weight:400;font-size:.8rem;color:var(--ink-3);margin-top:2px}
.minfo{padding:2px 14px 10px;font-size:.85rem;color:var(--ink-2)}
.minfo p{margin:0 0 4px}.minfo p:last-child{margin:0}
.lw .lrow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.lw .lrow>.les{flex:1;min-width:0;border-top:0}
.lx{border:0;background:none;padding:0 14px;color:var(--ink-3);font-size:.8rem;min-width:44px}
.lx:hover{color:var(--purple);background:var(--page)}
.lx span{display:inline-block;transition:transform .15s}.lw.ex .lx span{transform:rotate(180deg)}
.lsum{display:none;margin:0;padding:0 14px 12px 48px;font-size:.85rem;color:var(--ink-2)}
.lw.ex .lsum{display:block}
.lcov{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:var(--page);border:1px solid var(--line);font-size:.92rem}
.lcov b{display:block;font-size:.8rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.les{display:flex;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
a.les:hover{background:var(--page);color:inherit}
.les.cur{background:var(--purple-soft)}
.les .st{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:.72rem;font-weight:700;flex-shrink:0;color:var(--ink-3)}
.les .st.ok{background:var(--purple);border-color:var(--purple);color:#fff}
.les.locked{color:var(--ink-3)}
.les .k{margin-left:auto;font-size:.75rem;color:var(--ink-3);white-space:nowrap}
.player{aspect-ratio:16/9;background:var(--black);border-radius:10px;display:grid;place-items:center;color:#e4dcf5;text-align:center;padding:16px}
.player .pl{width:64px;height:64px;border-radius:50%;background:var(--lemon);color:var(--black);display:grid;place-items:center;font-size:1.5rem;margin:0 auto 8px}
.notice{border-radius:10px;padding:12px 14px;border:1px solid #d9c9f3;background:var(--purple-soft)}
.notice.warn{background:var(--lemon-soft);border-color:#e6dc7a}
.dlrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.dlrow:last-child{border:0}
/* curriculum builder */
.cb-mod{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--page)}
.cb-mod+.cb-mod{margin-top:8px}
.cb-mh,.cb-les{display:flex;gap:6px;align-items:center}
.cb-mh input{font-weight:600}
.cb-n{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--purple);white-space:nowrap}
.cb-les{margin:6px 0 0 12px}
.cb-ln{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:.7rem;flex-shrink:0}
.cb-les input[data-cb=t]{flex:1;min-width:0}
.cb-les select{width:100px;flex-shrink:0}.cb-les input[type=number]{width:66px;flex-shrink:0}
.cb-mod input,.cb-mod select{padding:6px 8px;font-size:.88rem}
.cb-mod .btn.ghost{padding:4px 6px;min-height:30px}
.cb-add{margin:6px 0 0 12px}
@media (max-width:520px){.cb-les{flex-wrap:wrap}.cb-les input[data-cb=t]{flex-basis:calc(100% - 30px)}}
/* events */
.ev{display:flex;gap:14px;align-items:flex-start}
.date{flex-shrink:0;width:58px;text-align:center;border-radius:10px;background:var(--purple-soft);color:var(--purple);padding:6px 0}
.date b{display:block;font:400 1.5rem var(--serif);line-height:1.1}
.date span{font-size:.7rem;font-weight:700;text-transform:uppercase}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.steps li:before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--lemon);color:var(--black);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.steps li:last-child{border:0}
.empty{text-align:center;padding:28px;color:var(--ink-3)}
.pf{display:flex;gap:14px;align-items:center}
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0;display:inline-grid;place-items:center;font-weight:700;color:#fff;background:var(--purple)}
[hidden]{display:none!important}
/* pinned welcome message */
.pinned{border:2px solid var(--purple);box-shadow:0 0 0 5px var(--purple-soft);padding:22px}
.pin-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pin-flag{display:inline-flex;gap:6px;align-items:center;background:var(--lemon);color:var(--black);font-weight:700;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.pinned h1{margin:0 0 .4em}
.pinned h2{margin:22px 0 10px}
.pinned .lead{max-width:68ch}
.howto{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.howto>div{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--page);border:1px solid var(--line);min-width:0}
.howto p{margin:0;font-size:.9rem}
.hi{font-size:1.4rem;line-height:1.2;flex-shrink:0}
.rules{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.rule{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;min-width:0}
.rule.hard{border-color:#e7a59f;background:#fdf3f2}
.rule b{display:block;margin-bottom:2px}
.rule p{margin:0;font-size:.88rem;color:var(--ink-2)}
.rule .ri{font-size:1.25rem;width:26px;flex-shrink:0;text-align:center;line-height:1.3}
.sign{margin:20px 0 0;font-size:.95rem}
.agree{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line-strong);padding-top:16px;margin-top:16px}
.navhint{font-size:.8rem;color:var(--ink-3);padding:4px 8px 8px;margin-bottom:4px;border-bottom:1px dashed var(--line);line-height:1.4}
.feedhead{display:flex;gap:10px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.feedhead h2{margin:0}

/* space banner themes (deliberately different from the hero) */
.th-lemon{background-color:var(--lemon)!important}.th-ink{background-color:var(--black)!important}.th-lilac{background-color:#ece3fb!important}.th-paper{background-color:#fff!important;border-bottom:1px solid var(--line)}
.th-img{background-color:var(--black)!important}
/* members & affiliates */

.cu-c{border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px;overflow:hidden}
.cu-c>summary{display:flex;gap:8px;align-items:center;padding:10px 12px;cursor:pointer;flex-wrap:wrap;list-style:none}
.cu-c>summary::-webkit-details-marker{display:none}
.cu-c>summary:before{content:"▸";color:var(--ink-3);font-size:.7rem;transition:transform .15s}
.cu-c[open]>summary:before{transform:rotate(90deg)}
.cu-m{border-top:1px solid var(--line);padding:6px 12px 10px;background:var(--page)}
.cu-mh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 0}
.cu-l{display:flex;gap:6px;align-items:center;padding:4px 6px 4px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);margin:4px 0 0 14px}
.cu-l .btn.ghost,.cu-mh .btn.ghost,.cu-c summary .btn.ghost{padding:4px 6px;min-height:30px}
.dh{cursor:grab;color:var(--ink-3);font-size:.95rem;padding:0 2px;user-select:none}
.sql{background:var(--black);color:#e4dcf5;border-radius:10px;padding:12px;font-size:.76rem;line-height:1.5;max-height:300px;overflow:auto;white-space:pre;margin:10px 0 0}
.sbstat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--page);border:1px solid var(--line)}
.sbstat .dotc{width:10px;height:10px;border-radius:50%;background:var(--line-strong);flex-shrink:0}
.sbstat .dotc.ok{background:#16a34a}.sbstat .dotc.bad{background:var(--red)}
.player.emb{padding:0;overflow:hidden;display:block}
.player.emb iframe,.player.emb video{width:100%;height:100%;border:0;display:block;background:#000}
.pdfv{width:100%;height:min(75vh,720px);border:1px solid var(--line);border-radius:10px;background:#fff;display:block}
.feedbar{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.ptile{display:flex;flex-direction:column;gap:10px;min-width:0}
.ptile footer{margin-top:auto;padding-top:4px}
.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;margin:0}
form[data-f=prices] input{padding:6px 8px;font-size:.88rem}

.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.acct .atabs{display:flex;gap:4px;background:var(--line,#eee);padding:4px;border-radius:999px;margin:0 0 16px;width:max-content}
.acct .atabs button{border:0;background:none;padding:7px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;color:inherit}
.acct .atabs button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.exitf .kick{align-self:flex-start}
</style>

function avatar(name,size=36,creator=false){
  const st=`width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px`+(creator?';box-shadow:0 0 0 2px var(--lemon)':'');
  if(creator&&S.creator.photo)return `<img class="avatar" src="${S.creator.photo}" alt="${esc(name)}" style="${st}">`;
  const ini=String(name).split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const hues=['#5b21b6','#2e1065','#121016','#6d28d9','#45404f','#7c3aed'];
  const bg=creator?'var(--purple)':hues[parseInt(hash(name).slice(1),36)%hues.length];
  return `<span class="avatar" style="${st};background:${bg}" aria-hidden="true">${esc(ini)}</span>`;
}

function readImg(file,w,h){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ar=w/h;let sw=img.width,sh=img.width/ar;if(sh>img.height){sh=img.height;sw=sh*ar}cv.getContext('2d').drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,w,h);res(cv.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function sanitize(html){
  const t=document.createElement('template');t.innerHTML=String(html||'');const ok=new Set(['B','STRONG','I','EM','U','BR','SPAN','DIV','SMALL','P','S']);
  const clean=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}clean(c);if(!ok.has(c.tagName)){c.replaceWith(...c.childNodes);return}[...c.attributes].forEach(a=>{if(a.name!=='class')c.removeAttribute(a.name)})})};
  clean(t.content);return t.innerHTML;
}

function sqlScript(email){
  return `-- Awelen Community: Supabase setup. Paste into Supabase > SQL Editor and press Run.

create extension if not exists pgcrypto;

-- Who may edit the site (admin = everything, editor = courses and text)
create table if not exists public.app_admins (
  email text primary key,
  role text not null default 'admin' check (role in ('admin','editor')),
  added_at timestamptz not null default now()
);

-- Learner, member and affiliate profiles
create table if not exists public.profiles (
  id uuid primary key default gen_random_uuid(),
  local_id text unique,
  user_id uuid unique references auth.users(id) on delete set null,
  kind text not null default 'member' check (kind in ('learner','member','affiliate')),
  name text not null,
  email text, phone text, city text, headline text, business text, stage text,
  skills text[] not null default '{}',
  bio text,
  status text not null default 'Active',
  courses text[] not null default '{}',
  affiliate jsonb,
  agreed_at timestamptz,
  joined_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
create index if not exists profiles_kind_idx on public.profiles(kind);
create index if not exists profiles_email_idx on public.profiles(lower(email));

-- The published site: spaces, tracks, courses, modules, lessons, text corrections
create table if not exists public.site_content (
  id text primary key,
  data jsonb not null,
  updated_at timestamptz not null default now(),
  updated_by text
);

create or replace function public.is_app_admin(min_role text default 'editor')
returns boolean language sql stable security definer set search_path = public as $$
  select exists (
    select 1 from public.app_admins a
    where lower(a.email) = lower(coalesce(auth.jwt() ->> 'email', ''))
      and (min_role = 'editor' or a.role = 'admin')
  );
$$;

create or replace function public.touch_updated_at() returns trigger language plpgsql as $$
begin new.updated_at = now(); return new; end $$;
drop trigger if exists profiles_touch on public.profiles;
create trigger profiles_touch before update on public.profiles for each row execute function public.touch_updated_at();
drop trigger if exists site_content_touch on public.site_content;
create trigger site_content_touch before update on public.site_content for each row execute function public.touch_updated_at();

alter table public.app_admins enable row level security;
alter table public.profiles enable row level security;
alter table public.site_content enable row level security;

drop policy if exists "team can see team" on public.app_admins;
create policy "team can see team" on public.app_admins for select to authenticated using (public.is_app_admin('editor'));
drop policy if exists "admins manage team" on public.app_admins;
create policy "admins manage team" on public.app_admins for all to authenticated using (public.is_app_admin('admin')) with check (public.is_app_admin('admin'));

drop policy if exists "admins manage profiles" on public.profiles;
create policy "admins manage profiles" on public.profiles for all to authenticated using (public.is_app_admin('admin')) with check (public.is_app_admin('admin'));
drop policy if exists "people read own profile" on public.profiles;
create policy "people read own profile" on public.profiles for select to authenticated using (user_id = auth.uid());
drop policy if exists "people update own profile" on public.profiles;
create policy "people update own profile" on public.profiles for update to authenticated using (user_id = auth.uid()) with check (user_id = auth.uid());

drop policy if exists "anyone reads the site" on public.site_content;
create policy "anyone reads the site" on public.site_content for select to anon, authenticated using (true);
drop policy if exists "team publishes the site" on public.site_content;
create policy "team publishes the site" on public.site_content for all to authenticated using (public.is_app_admin('editor')) with check (public.is_app_admin('editor'));

-- Storage for lesson videos, PDFs and downloads (files can be read by anyone who has the link)
insert into storage.buckets (id, name, public, file_size_limit)
values ('lesson-files', 'lesson-files', true, 52428800)
on conflict (id) do update set public = true;
drop policy if exists "team uploads lesson files" on storage.objects;
create policy "team uploads lesson files" on storage.objects for insert to authenticated with check (bucket_id = 'lesson-files' and public.is_app_admin('editor'));
drop policy if exists "team updates lesson files" on storage.objects;
create policy "team updates lesson files" on storage.objects for update to authenticated using (bucket_id = 'lesson-files' and public.is_app_admin('editor'));
drop policy if exists "team deletes lesson files" on storage.objects;
create policy "team deletes lesson files" on storage.objects for delete to authenticated using (bucket_id = 'lesson-files' and public.is_app_admin('editor'));

-- Make yourself the first admin
insert into public.app_admins (email, role) values ('${String(email||'YOUR-EMAIL@example.com').replace(/'/g,"''").toLowerCase()}', 'admin')
on conflict (email) do update set role = 'admin';
`}

      const r=await sampleFn(aiPrompt(),{signal:aiCtl.signal,onText:({text})=>{ai.out=text;document.querySelectorAll('[data-ai-out]').forEach(el=>{el.hidden=false;el.textContent=text;el.scrollTop=el.scrollHeight})}});

      if(aiCtl.signal.aborted){if(e&&e.text&&!ai.out)ai.out=e.text}
      else if(e&&e.code==='not_granted'){sampleFn=null;sampleState='off';ai.out=aiTemplate()}
      else{ai.err=e&&e.code==='rate_limited'?'Claude is busy right now. Please wait a minute and try again.':'Something went wrong while writing. Please try again.';if(e&&e.text){ai.out=e.text;ai.err=''}}
    }

/* ---------- v15: Track 1 outlines (Idea Discovery, Business Model Development 1 & 2, Economic Outlook) ----------
   Each course carries outlineV, so the update also reaches content later pulled back from Supabase.
   Videos, PDFs, notes and scripts already attached to a lesson are kept when the lesson title still matches
   (Idea Discovery also matches by position). Anything that cannot be matched is kept in o.archivedLessons. */
function migrate14(o){
  const cs=o.courses=o.courses||[];
  const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
  const MEDIA=['video','pdf','content','script'], KEEP=[...MEDIA,'mins','kind'];
  const space=(cs.find(c=>c.id==='idea')||{}).space||((o.spaces||[]).find(x=>x.type==='course')||{}).id||'courses';
  const refresh=(cid,make)=>{
    let c=cs.find(x=>x.id===cid);
    if(c&&c.outlineV===OUTLINE_V(cid))return c;
    if(!c){if(!make)return null;c=make();cs.push(c)}
    const T=OUTLINES[cid], old=c.modules||[], pool=old.flatMap((m,mi)=>(m.lessons||[]).map((l,li)=>({l,mi,li,used:false})));
    const mods=t1Mods(cid), seen=new Set();
    mods.forEach((m,mi)=>{m.lessons=m.lessons.map((l,li)=>{
      let hit=pool.find(x=>!x.used&&norm(x.l.title)===norm(l.title));
      if(!hit&&cid==='idea')hit=pool.find(x=>!x.used&&x.mi===mi&&x.li===li);
      let n=l;if(hit){hit.used=true;n={...l,id:hit.l.id||l.id};KEEP.forEach(k=>{if(hit.l[k])n[k]=hit.l[k]})}
      if(seen.has(n.id))n.id=uid();seen.add(n.id);return n})});
    const left=pool.filter(x=>!x.used&&MEDIA.some(k=>x.l[k]));
    if(left.length)o.archivedLessons=(o.archivedLessons||[]).concat(left.map(x=>({course:c.title,module:(old[x.mi]||{}).title||'',...x.l,archivedAt:Date.now()})));
    c.modules=mods;c.done=(c.done||[]).filter(id=>seen.has(id));
    ['title','icon','headline','sub','desc','parts'].forEach(k=>{if(T[k]!=null)c[k]=T[k]});
    if(cid==='snb'||cid==='bmd2')c.downloads=[...t1Downloads(cid),...(c.downloads||[]).filter(d=>/\|\s*https?:\/\//.test(d))];
    if(T.track)c.track=T.track;else if(!c.track)c.track='t-idea';
    c.outlineV=OUTLINE_V(cid);applied.add(cid);return c};
  const applied=new Set();
  refresh('idea');refresh('econ');
  const c1=refresh('snb');
  if(c1&&!cs.some(x=>x.id==='bmd2')){
    const c2=refresh('bmd2',()=>({id:'bmd2',space:c1.space||space,track:c1.track||'t-idea',price:0,instN:1,instAmt:0,modules:[],downloads:[],pay:null,done:[]}));
    cs.splice(cs.indexOf(c2),1);cs.splice(cs.indexOf(c1)+1,0,c2);
  }else refresh('bmd2');
  if(c1){const nm=x=>T1_OLD_NAMES.includes(x)?c1.title:x;
    (o.members||[]).forEach(m=>{if(Array.isArray(m.courses))m.courses=m.courses.map(nm);((m.aff&&m.aff.sales)||[]).forEach(s=>{s.course=nm(s.course)})});
    (o.payments||[]).forEach(p=>{T1_OLD_NAMES.forEach(n=>{if(String(p.item||'').startsWith(n))p.item=c1.title+p.item.slice(n.length)})})}
  /* Track 2: Management Foundation. Now Run It first; Opportunity Recognition and Leading Yourself First leave the track (kept under Other courses). */
  TRACK2_ORDER.forEach(cid=>refresh(cid,()=>({id:cid,space,track:'t-lead',price:0,instN:1,instAmt:0,modules:[],downloads:[],pay:null,done:[]})));
  if(TRACK2_ORDER.some(id=>applied.has(id))){
    const list=TRACK2_ORDER.map(id=>cs.find(c=>c.id===id)).filter(Boolean), at=Math.min(...list.map(c=>cs.indexOf(c)));
    list.forEach(c=>cs.splice(cs.indexOf(c),1));cs.splice(Math.min(at,cs.length),0,...list);
    cs.forEach(c=>{if((c.id==='opp'||c.id==='lead')&&c.track==='t-lead')c.track=''});
    const t=(o.tracks||[]).find(x=>x.id==='t-lead');if(t&&(!t.desc||T2_OLD_DESC.includes(t.desc)))t.desc=T2_DESC}
  /* Track 3: Driving Change, Transformation & Innovation. Driving Change and Building Sustainable Wealth leave the track (kept under Other courses). */
  refresh('wealth',()=>({id:'wealth',space,track:'t-exec',price:0,instN:1,instAmt:0,modules:[],downloads:[],pay:null,done:[],t3:1}));
  TRACK3_ORDER.forEach(cid=>refresh(cid,()=>({id:cid,space,track:'t-exec',price:0,instN:1,instAmt:0,modules:[],downloads:[],pay:null,done:[]})));
  if(TRACK3_ORDER.some(id=>applied.has(id))){
    const list=TRACK3_ORDER.map(id=>cs.find(c=>c.id===id)).filter(Boolean), at=Math.min(...list.map(c=>cs.indexOf(c)));
    list.forEach(c=>cs.splice(cs.indexOf(c),1));cs.splice(Math.min(at,cs.length),0,...list);
    cs.forEach(c=>{if(c.id==='change'&&c.track==='t-exec')c.track=''});
    const t=(o.tracks||[]).find(x=>x.id==='t-exec');
    if(t){if(!t.title||t.title==='Executive Leadership')t.title=TRACK3_TITLE;if(!t.desc||/^For leaders growing a business beyond themselves/.test(t.desc))t.desc=TRACK3_DESC}}
  /* Track 4: AMLD. Executive Peer Circle course added, Executive Presence Foundation updated, The Crucible Circle moved in from Solve. */
  const epf=cs.find(c=>c.id==='ep-found'), epWas=epf&&epf.outlineV;
  refresh('ep-found');
  refresh('peerc',()=>({id:'peerc',space,track:'t-adv',price:0,instN:1,instAmt:0,modules:[],downloads:[],pay:null,done:[]}));
  if(applied.has('ep-found')||applied.has('peerc')){
    const co=cs.find(c=>c.id==='ep-cohort'), now=EP_MODS.map(m=>m.title.replace(/^Module \d+: /,''));
    const swap=(x,old,nw)=>x&&x.title&&x.title.endsWith(': '+old)?(x.title=x.title.slice(0,-old.length)+nw):0;
    if(co&&!epWas)(co.modules||[]).forEach(m=>{EP_OLD_SHORT.forEach((old,i)=>{if(old!==now[i]){swap(m,old,now[i]);(m.lessons||[]).forEach(l=>swap(l,old,now[i]))}})});
    (o.spaces||[]).forEach(s=>{if(s.type==='crucible'&&(!s.track||s.track==='t-solve'))s.track='t-adv'});
    const ta=(o.tracks||[]).find(x=>x.id==='t-adv');if(ta&&!ta.order)ta.order=T4_ORDER.slice();
    const ts=(o.tracks||[]).find(x=>x.id==='t-solve');if(ts&&ts.desc===T4_SOLVE_OLD)ts.desc=T4_SOLVE_DESC}
  (o.announcements||[]).forEach(a=>{if(a.id==='an1'&&/^Idea Discovery now has 5 modules/.test(a.title||'')){a.title=T1_ANN_TITLE;a.body=String(a.body||'').replace(/^Idea Discovery has grown\.[^\n]*/,T1_ANN_BODY)}});
  return o;
}
/* ---------- v19: tidy-up. Courses already covered by the new ones are removed, with the old Executive Peer-Circle room
   and its posts. Runs on every load, so content pulled back from Supabase is tidied too. Building Sustainable Wealth
   joins Track 3 once (c.t3 marks it), after which it can be moved freely. */
/* ---------- v16: course fees in US dollars ----------
   Each course listed here gets its USD fee once (c.usdV marks it), after which
   any price set in Admin › Prices sticks. Old naira installment plans are
   switched off for these courses, since their amounts no longer fit. */
function migrate16(o){
  const USD_FEES={idea:50,snb:100,bmd2:75,econ:75,run:50,fin:100,strat:100,plan:100,scale:150,systems:150,visual:150,design:100,culture:150,wealth:100,'ep-found':150,peerc:150};
  (o.courses||[]).forEach(c=>{if(c.usdV||!(c.id in USD_FEES))return;Object.assign(c,{price:USD_FEES[c.id],currency:'USD',instN:1,instAmt:0,usdV:1})});
  return o;
}
function migrate15(o){
  const RETIRED_COURSES={opp:'Opportunity Recognition',lead:'Leading Yourself First',change:'Driving Change'};
  o.courses=(o.courses||[]).filter(c=>!(c.id in RETIRED_COURSES));
  const names=Object.values(RETIRED_COURSES);
  (o.members||[]).forEach(m=>{if(Array.isArray(m.courses))m.courses=m.courses.filter(x=>!names.includes(x))});
  (o.ebooks||[]).forEach(b=>{if(b.course in RETIRED_COURSES)b.course=''});
  const gone=new Set((o.spaces||[]).filter(s=>s.type==='peer'||s.id==='peers').map(s=>s.id));
  if(gone.size){o.spaces=o.spaces.filter(s=>!gone.has(s.id));o.posts=(o.posts||[]).filter(p=>!gone.has(p.space));o.events=(o.events||[]).filter(e=>!gone.has(e.space))}
  (o.tracks||[]).forEach(t=>{if(Array.isArray(t.order))t.order=t.order.filter(k=>!gone.has(k.slice(2))&&!(k.slice(2) in RETIRED_COURSES));
    if(t.id==='t-exec'&&t.desc===TRACK3_DESC_V1)t.desc=TRACK3_DESC});
  const w=o.courses.find(c=>c.id==='wealth');
  if(w&&!w.t3){w.track='t-exec';w.t3=1;const last=[...o.courses].reverse().find(c=>c!==w&&c.track==='t-exec');
    if(last){o.courses.splice(o.courses.indexOf(w),1);o.courses.splice(o.courses.indexOf(last)+1,0,w)}}
  return o;
}

async function sbUpload(file,folder,kind){
  await sb();needAdmin('editor');
  if(file.size>MAXMB*1024*1024)throw new Error(`The file is ${(file.size/1048576).toFixed(0)} MB. The limit is ${MAXMB} MB. Upload long videos to YouTube (unlisted) or Bunny Stream and paste the link.`);
  if(kind==='video'&&!/^video\//.test(file.type||''))throw new Error('Please choose a video file (MP4 works best).');
  if(kind==='pdf'&&file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name))throw new Error('Please choose a PDF file.');
  const ext=((file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin').slice(0,8);
  const path=`${folder}/${new Date().toISOString().slice(0,10)}-${uid()}${uid()}.${ext}`;
  const {error}=await sbClient.storage.from('lesson-files').upload(path,file,{contentType:file.type||undefined,upsert:false,cacheControl:'31536000'});
  if(error)throw new Error(/bucket/i.test(error.message||'')?'The storage bucket is missing. Run the latest setup script from Admin › Database again.':errMsg(error));

}
function embedUrl(u){
  u=String(u||'').trim();if(!/^https?:\/\//i.test(u))return {};let m;
  if((m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/)))return {kind:'iframe',src:'https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0&modestbranding=1'};
  if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/)))return {kind:'iframe',src:'https://player.vimeo.com/video/'+m[1]};
  if(/iframe\.mediadelivery\.net\/(embed|play)\//.test(u))return {kind:'iframe',src:u.replace('/play/','/embed/')};
  if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)))return {kind:'iframe',src:'https://drive.google.com/file/d/'+m[1]+'/preview'};
  if(/\.(mp4|webm|ogv|ogg|mov|m4v)(\?|#|$)/i.test(u)||/\/storage\/v1\/object\/public\//.test(u))return {kind:'file'};
  return {kind:'link'};
}

async function sha(s){if(!(window.crypto&&crypto.subtle))throw new Error('This browser cannot check the passcode. Open the site over https.');
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

    }catch(e){fail('Sign-in failed: '+errMsg(e))}}
});
A.forgotPw=async t=>{const f=t.closest('form'),email=(new FormData(f).get('email')||'').trim();
  if(!okEmail(email)){toast('Type your email first, then press Forgot password.');return}
  if(!sbOn()){toast('Please contact us and we will reset your password.');return}
  try{await sb();const {error}=await sbClient.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});if(error)throw error;toast('We sent a reset link to '+email)}catch(e){toast('Could not send the link: '+errMsg(e))}};
A.signOut=()=>{lsSet(MEMK,null);if(sbClient&&sbUser&&!sbRole)sbClient.auth.signOut().catch(()=>{});S.role='visitor';if(dlg.open)dlg.close();commit();toast('You are signed out. See you soon!')};

/* Admin: visitors list (People tab) */
let visDb=null;
const _adPeople=adPeople;
adPeople=function(){const list=visDb||(S.visitors||[]);
  const rows=list.slice(0,200).map(v=>`<div class="adrow">${avatar(v.name||'?',32)}<span style="flex:1;min-width:0"><b>${esc(v.name)}</b><br><span class="small muted">${esc(v.email)}${v.phone?' · '+esc(v.phone):''} · ${esc(v.interest||'')}</span></span><span class="small muted">${v.visits>1?v.visits+' visits · ':''}${ago(Date.parse(v.last_seen)||v.t||Date.now())}</span></div>`).join('');
  return _adPeople()+`<section class="card"><div class="spread"><h2 style="margin:0">Visitors who signed up</h2><div class="row">${sbRole==='admin'?'<button class="btn quiet sm" data-a="visLoad">↻ Load from Supabase</button>':''}${list.length?'<button class="btn quiet sm" data-a="visCsv">⬇ Export CSV</button>':''}</div></div>
  <p class="small muted" style="margin:6px 0 10px">${visDb?`${pl(list.length,'visitor')} from the database.`:sbOn()?'Visitors are saved in Supabase. Sign in as admin and press Load to see everyone.':'Supabase is not connected yet, so sign-ups are only kept in the browser they were made in. Connect it in the Database tab to collect them in one place.'}</p>
  ${rows?`<div class="adlist">${rows}</div>`:'<p class="muted small">No visitor sign-ups yet.</p>'}</section>`};
A.visLoad=async()=>{try{await sb();const {data,error}=await sbClient.from('visitors').select('*').order('last_seen',{ascending:false}).limit(1000);if(error)throw error;visDb=data||[];render();toast(pl(visDb.length,'visitor')+' loaded')}catch(e){toast('Supabase: '+errMsg(e))}};
A.visCsv=()=>{const list=visDb||(S.visitors||[]),q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
  const csv=['Name,Email,Phone,Interest,Visits,First seen,Last seen'].concat(list.map(v=>[v.name,v.email,v.phone,v.interest,v.visits||1,v.first_seen||new Date(v.t||Date.now()).toISOString(),v.last_seen||''].map(q).join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='awelen-visitors.csv';a.click()};

/* Supabase script: visitors table, sign-up function and member self-registration */
const _sql=sqlScript;
sqlScript=function(e){return _sql(e)+`

-- Visitors who leave their details (filled in by the sign-up form, read by admins only)
create table if not exists public.visitors (
  id uuid primary key default gen_random_uuid(),
  email text not null unique,
  name text not null,
  phone text, interest text, first_page text,
  visits int not null default 1,
  first_seen timestamptz not null default now(),
  last_seen timestamptz not null default now()
);
alter table public.visitors enable row level security;
drop policy if exists "admins read visitors" on public.visitors;
create policy "admins read visitors" on public.visitors for select to authenticated using (public.is_app_admin('admin'));
drop policy if exists "admins remove visitors" on public.visitors;
create policy "admins remove visitors" on public.visitors for delete to authenticated using (public.is_app_admin('admin'));

create or replace function public.register_visitor(p_name text, p_email text, p_phone text default null, p_interest text default null, p_page text default null)
returns text language plpgsql security definer set search_path = public as $$
declare e text := lower(trim(coalesce(p_email,''))); known boolean;
begin
  if e !~ '^[^@[:space:]]+@[^@[:space:]]+[.][^@[:space:]]+$' or length(e) > 200 then raise exception 'Invalid email'; end if;
  known := exists (select 1 from public.visitors v where v.email = e) or exists (select 1 from public.profiles p where lower(p.email) = e);
  insert into public.visitors (email, name, phone, interest, first_page)
  values (e, left(coalesce(nullif(trim(p_name),''),'Visitor'),120), left(nullif(trim(p_phone),''),40), left(p_interest,80), left(p_page,200))
  on conflict (email) do update set visits = public.visitors.visits + 1, last_seen = now(),
    phone = coalesce(excluded.phone, public.visitors.phone), interest = coalesce(excluded.interest, public.visitors.interest);
  return case when known then 'returning' else 'new' end;
end $$;
revoke all on function public.register_visitor(text,text,text,text,text) from public;
grant execute on function public.register_visitor(text,text,text,text,text) to anon, authenticated;

-- Members create their own profile when they sign up
drop policy if exists "people create own profile" on public.profiles;
create policy "people create own profile" on public.profiles for insert to authenticated with check (user_id = auth.uid() and kind = 'member');
`};

if(!location.hash)location.replace('#/space/welcome');
render();
sbStart();
</script>
